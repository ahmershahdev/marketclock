version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on the MySQL 8.4 LTS line; 9.x and later are short-lived innovation releases.
      - dependency-name: mysql
        versions: [">=9"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Majors are upgraded by hand: they need peer ranges (openapi-typescript, eslint-config-next)
      # and the Node 22 runtime to line up first.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
