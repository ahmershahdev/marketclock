version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on the MySQL 8.4 LTS line; 9.x and later are short-lived innovation releases.
      - dependency-name: mysql
        versions: [">=9"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Types must match the Node 22 runtime used in CI and Docker.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
