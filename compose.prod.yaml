name: marketclock

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: marketclock
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MARKETCLOCK_ENV: prod
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/marketclock?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    # Migrations and the sourced seed rows are idempotent, so they run on every start.
    command: >-
      sh -c "alembic upgrade head && flask --app wsgi seed &&
      exec gunicorn --bind 0.0.0.0:5000 --workers 3 --access-logfile - wsgi:app"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:5000
        SITE_URL: ${SITE_URL:-https://marketclock.ahmershah.dev}
    restart: unless-stopped
    environment:
      API_URL: http://api:5000
      SITE_URL: ${SITE_URL:-https://marketclock.ahmershah.dev}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  mysql-data:
